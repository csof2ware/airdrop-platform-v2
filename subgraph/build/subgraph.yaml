specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: AirdropToken
    network: local
    source:
      address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
      abi: AirdropToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Holder
        - TransferSingle
      abis:
        - name: AirdropToken
          file: AirdropToken/AirdropToken.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
      file: AirdropToken/AirdropToken.wasm
  - kind: ethereum
    name: SignedAirdrop
    network: local
    source:
      address: "0xa513E6E4b8f2a923D98304ec87F64353C4D5C853"
      abi: SignedAirdrop
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Holder
        - TransferSingle
      abis:
        - name: SignedAirdrop
          file: SignedAirdrop/SignedAirdrop.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
      file: AirdropToken/AirdropToken.wasm
