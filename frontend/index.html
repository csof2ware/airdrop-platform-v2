<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gasless Airdrop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .result a {
      color: inherit;
      font-weight: 600;
    }
    .stats {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }
    .stats h3 {
      color: #667eea;
      margin-bottom: 16px;
      font-size: 18px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }
    .stat-label {
      color: #666;
    }
    .stat-value {
      color: #333;
      font-weight: 600;
      font-family: monospace;
    }
    .holders-list {
      margin-top: 16px;
    }
    .holder {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .holder-address {
      font-family: monospace;
      color: #667eea;
      font-weight: 600;
    }
    .holder-balance {
      color: #28a745;
      font-weight: 600;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Gasless Airdrop</h1>
    <p class="subtitle">Claim tokens sem pagar gas — relayer paga por você</p>

    <form id="claimForm">
      <div class="form-group">
        <label for="claimant">Seu endereço</label>
        <input
          type="text"
          id="claimant"
          placeholder="0x..."
          value="0x36c2402Db92B35B2eDd07D017758102eaa905483"
          required
        />
      </div>
      <div class="form-group">
        <label for="amount">Quantidade</label>
        <input type="number" id="amount" value="10" min="1" required />
      </div>
      <button type="submit" id="submitBtn">
        <span id="btnText">Claim Gasless</span>
      </button>
    </form>

    <div class="result" id="result"></div>

    <div class="stats">
      <h3>📊 Estatísticas</h3>
      <div class="stat-row">
        <span class="stat-label">Total de holders:</span>
        <span class="stat-value" id="totalHolders">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Tokens mintados:</span>
        <span class="stat-value" id="totalMinted">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Último bloco:</span>
        <span class="stat-value" id="lastBlock">-</span>
      </div>

      <div class="holders-list" id="holdersList"></div>
    </div>
  </div>

  <script>
    const GRAPH_URL = 'http://graph-node:8000/subgraphs/name/airdrop-v2';
    const SIGNER_URL = 'http://localhost:3001/sign';
    const RELAYER_URL = 'http://localhost:3002/relay';
    const STATS_URL = 'http://localhost:3000/stats';

    async function claimGasless(claimant, amount) {
      // 1) Pede assinatura pro signer
      const signRes = await fetch(SIGNER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ claimant, amount: String(amount) })
      });
      if (!signRes.ok) throw new Error('Signer falhou');
      const signed = await signRes.json();

      // 2) Envia pro relayer
      const relayRes = await fetch(RELAYER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(signed)
      });
      if (!relayRes.ok) {
        const err = await relayRes.json();
        throw new Error(err.error || 'Relayer falhou');
      }
      return await relayRes.json();
    }

    async function loadStats() {
      try {
        const res = await fetch(STATS_URL);
        const stats = await res.json();
        document.getElementById('totalHolders').textContent = stats.holders;
        document.getElementById('totalMinted').textContent = stats.totalMinted;
        document.getElementById('lastBlock').textContent = stats.lastBlock;
      } catch (e) {
        console.error('Erro ao carregar stats:', e);
      }
    }

    async function loadHolders() {
      try {
        const res = await fetch(GRAPH_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: '{ holders(first: 5, orderBy: balance, orderDirection: desc) { id balance transferCount } }'
          })
        });
        const data = await res.json();
        const holdersList = document.getElementById('holdersList');
        holdersList.innerHTML = '<h3 style="margin-top: 20px;">👥 Top 5 Holders</h3>';
        data.data.holders.forEach(h => {
          holdersList.innerHTML += `
            <div class="holder">
              <div class="holder-address">${h.id.slice(0, 6)}...${h.id.slice(-4)}</div>
              <div>Balance: <span class="holder-balance">${h.balance}</span> | Transfers: ${h.transferCount}</div>
            </div>
          `;
        });
      } catch (e) {
        console.error('Erro ao carregar holders:', e);
      }
    }

    document.getElementById('claimForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const result = document.getElementById('result');
      const claimant = document.getElementById('claimant').value;
      const amount = document.getElementById('amount').value;

      btn.disabled = true;
      btnText.innerHTML = '<span class="loading"></span>Processando...';
      result.style.display = 'none';

      try {
        const tx = await claimGasless(claimant, amount);
        result.className = 'result success';
        result.innerHTML = `
          ✅ Claim minerada!<br>
          TX: <a href="#" onclick="alert('Explorer nao disponivel em hardhat local')">${tx.txHash.slice(0, 18)}...</a><br>
          Bloco: ${tx.blockNumber} | Novo saldo: ${tx.newBalance}
        `;
        result.style.display = 'block';

        // Recarrega stats após 2s
        setTimeout(() => {
          loadStats();
          loadHolders();
        }, 2000);
      } catch (e) {
        result.className = 'result error';
        result.textContent = '❌ ' + e.message;
        result.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Claim Gasless';
      }
    });

    // Carrega stats iniciais
    loadStats();
    loadHolders();

    // Polling a cada 5s
    setInterval(() => {
      loadStats();
      loadHolders();
    }, 5000);
  </script>
</body>
</html>
